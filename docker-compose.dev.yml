services:
  pic-moment:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pic-moment-dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - pic_moment_node_modules:/app/node_modules
      - pic_moment_next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    restart: unless-stopped

volumes:
  pic_moment_node_modules:
  pic_moment_next:
